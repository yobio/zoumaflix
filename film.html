<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Film - ZoumaFlix</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="film.css">

  <!-- Incluez la feuille de style de Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>
<body>
  <header class="banner" id="banner" style="background-color: #ee3523;">
    <a href="index.html">
      <img id="banner-img" src="logo.png" alt="Zoumaflix">
    </a>

    <div class="header-actions">
        <!-- button dans un div pour eviter de decaler les autres lorsque sa taille augmente avec hover -->
        <!--
        <div class="button-container">
            <button title="Profil"><i class="bi bi-person-circle"></i></button>
        </div>
        -->
    </div>
  </header>

  <main class="main-content" id="main">
    <section class="film-section">
      <img id="filmPoster" class="film-poster" alt="Affiche du film">
      <div class="film-details">
        <h2 id="filmTitle"></h2>
		<span class="legend"><i class="bi bi-calendar3"></i> <span id="filmDate"></span></span></br>
        <span class="legend"><i class="bi bi-clock"></i> <span id="filmDuration"></span></span>
        <p class="film-description" id="filmDescription"></p>

        <div class="film-actions">
          <button class="btn red" id="btnWatch">
            <i class="bi bi-film"></i>
            <span>Regarder</span>
          </button>
        </div>

		<div class="episodes-list" id="episodesContainer"></div>
      </div>
    </section>
  </main>

  <!-- Main pour le lecteur vidéo, caché par défaut -->
  <main class="main-content" id="playerMain" style="display:none;">
    <div class="player-header">
      <button id="btnBack" class="btn-back">
        <i class="bi bi-arrow-left"></i> Retour
      </button>
    </div>
    <div class="iframe-container">
      <iframe id="playerIframe" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </main>

  <script src="main.js"></script>
  <script src="film.js"></script>
</body>
</html>
