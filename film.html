<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Titre du film - Application de streaming de films</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="film.css">

  <!-- Incluez la feuille de style de Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>
<body>
  <header class="banner" id="banner" style="background-color: #ee3523;">
    <a href="index.html">
      <img id="banner-img" src="logo.png" alt="Zoumaflix">
    </a>

    <div class="header-actions">
        <!-- button dans un div pour eviter de decaler les autres lorsque sa taille augmente avec hover -->
        <div class="button-container">
            <button title="Rechercher"><i class="bi bi-search"></i></button>
        </div>
        <div class="button-container">
            <button title="Profil"><i class="bi bi-person-circle"></i></button>
        </div>
    </div>
  </header>

  <main class="main-content">
    <section class="film-section">
      <img src="https://m.media-amazon.com/images/M/MV5BOTg0Mzc2MGQtYTRhNS00ZThmLTg2MmQtMDY3Zjk4YTNkZjRlXkEyXkFqcGdeQXVyMjA0MzYwMDY@._V1_.jpg" alt="Autant en emporte le vent" class="film-poster">
      <div class="film-details">
        <h2>Autant en emporte le vent</h2>
        <span class="film-date">1939</span>
        <span class="film-duration">3h 58min</span>
        <p class="film-director">Victor Fleming</p>
        <p class="film-description">Description du film</p>

        <div class="film-actions">
          <button class="btn btn-download disabled">
            <i class="bi bi-cloud-download"></i>
            <span>Télécharger</span>
          </button>
          <button class="btn btn-languages" target-popup="language-options">
            <i class="bi bi-chat-square-text"></i>
          </button>
          <div class="popup" popup-id="language-options">
            <div class="popup-content">
              <h3>Sélectionner une langue</h3>
              <select>
                <option value="fr">Français</option>
                <option value="en">Anglais</option>
                <option value="es">Espagnol</option>
              </select>
            </div>
          </div>



          <button class="btn btn-delete">
            <i class="bi bi-trash3"></i>
            <span>Supprimer</span>
          </button>
          <button class="btn btn-watch">
            <i class="bi bi-film"></i>
            <span>Regarder</span>
          </button>
        </div>
      </div>
    </section>

    <section class="related-films-section">
      <h2>Vous aimerez aussi</h2>
      <div class="film-grid">
        <div class="film">
          <img src="https://m.media-amazon.com/images/M/MV5BMTc0MDEzOTg5MV5BMl5BanBnXkFtZTgwNDA4OTU0MTE@._V1_.jpg" alt="Affiche de Film 8">
          <h3><a href="/films/film8">Il était une fois dans l'Ouest</a></h3>
        </div>
        <div class="film">
          <img src="https://m.media-amazon.com/images/M/MV5BMTk0MzQwNDE4Ml5BMl5BanBnXkFtZTgwODQ4ODE5MDE@._V1_.jpg" alt="Affiche de Film 9">
          <h3><a href="/films/film9">Le Bon, la brute, le truand</a></h3>
        </div>
        <!-- Ajoutez autant d'éléments de film que nécessaire -->
      </div>
    </section>
  </main>

  <script src="main.js"></script>
  <script src="film.js"></script>
</body>
</html>
